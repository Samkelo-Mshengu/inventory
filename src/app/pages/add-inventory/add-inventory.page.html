<ion-content class="ion-padding add-product-content">
  <!-- Store Manager Section -->
  <ion-card class="custom-card">
    <ion-card-header>
      <ion-card-title>Store Manager Details</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Name & Surname</ion-label>
        <ion-input [(ngModel)]="empName" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Employee Number</ion-label>
        <ion-input [(ngModel)]="employeeNumber" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Contact Number</ion-label>
        <ion-input [(ngModel)]="contactNo" type="tel" (ionChange)="validatePhoneNumber()"></ion-input>
      </ion-item>
      <ion-text color="danger" *ngIf="contactNo && !validatePhoneNumber()">
        Enter a valid cellphone number
      </ion-text>
    </ion-card-content>
  </ion-card>

  <!-- Product Section -->
  <ion-card class="custom-card">
    <ion-card-header>
      <ion-card-title>Add Product</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Item Name</ion-label>
        <ion-input [(ngModel)]="itemName" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Quantity</ion-label>
        <ion-input [(ngModel)]="quantity" type="number"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Price (ZAR)</ion-label>
        <ion-input [(ngModel)]="price" type="number" step="0.01"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Category</ion-label>
        <ion-input [(ngModel)]="category" type="text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Date Added</ion-label>
        <ion-text>{{ currentDate | date: 'medium' }}</ion-text>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <!-- Image Upload Section -->
  <div class="image-upload-section">
    <img [src]="previewImage" *ngIf="previewImage" class="preview-img" />
    <label class="capture-label" *ngIf="!imageSource">
      <ion-icon name="camera-outline" (click)="takePhoto()" class="camera-icon"></ion-icon>
      <span>Capture Product Photo</span>
    </label>
  </div>

  <!-- Action Buttons -->
  <ion-button expand="block" color="primary" (click)="submit()" [disabled]="submitDisabled()">
    Add Product
  </ion-button>
  <ion-button expand="block" fill="outline" color="primary" (click)="addOrdersToFirestore(inventories)">
    Done
  </ion-button>
</ion-content>
